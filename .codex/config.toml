# movie-finder-infrastructure — Codex project configuration
# Scoped MCP servers for the IaC / Azure provisioning submodule.

approval_policy = "on-request"
model_reasoning_effort = "high"

[features]
multi_agent = true

[mcp_servers.github]
command  = "npx"
args     = ["-y", "@modelcontextprotocol/server-github"]
env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN"]

[mcp_servers.azure]
command = "npx"
args    = ["-y", "@azure/mcp@latest", "server", "start"]
