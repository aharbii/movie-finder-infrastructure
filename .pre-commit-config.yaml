# =============================================================================
# movie-finder-infrastructure — pre-commit configuration
#
# Standardized repository tooling:
# - Common hooks for file health and secrets
# - Local Terraform hooks that mirror CI (`terraform fmt`, `validate`, `tflint`)
# - The primary Docker-only contract remains via Makefile targets
# =============================================================================

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^\.vscode/ # VS Code config files use JSONC (comments allowed)
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: detect-private-key
      - id: pretty-format-json
        exclude: ^\.vscode/
      - id: sort-simple-yaml

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline

  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform fmt
        language: system
        entry: bash -lc 'cd terraform && terraform fmt -check -recursive'
        files: ^terraform/.*\.(tf|tfvars)$
        pass_filenames: false
      - id: terraform-validate
        name: Terraform validate
        language: system
        entry: bash -lc 'cd terraform && terraform init -backend=false -reconfigure >/dev/null && terraform validate'
        files: ^terraform/
        pass_filenames: false
      - id: terraform-tflint
        name: TFLint
        language: system
        entry: bash -lc 'cd terraform && tflint --init >/dev/null && tflint --format compact'
        files: ^terraform/.*\.(tf|tfvars)$
        pass_filenames: false
